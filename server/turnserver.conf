# ========================================================
# Coturn (WebRTC STUN/TURN P2P 中继中转服务器) 配置文件
# 适用于 csTimer2 对战模块的 WebRTC P2P 穿透中转
# ========================================================

# 监听端口（STUN/TURN 标准端口）
listening-port=3478
# tls-listening-port=5349

# 绑定的网卡 IP，若不确定可留空或设为 0.0.0.0
listening-ip=0.0.0.0

# ⚠️ 关键配置：你的服务器真实公网 IP
# 几乎所有云服务器（腾讯云、阿里云等）系统内网卡都是私有 IP，必须配置 external-ip，否则 WebRTC 客户端拿不到正确的公网中继候选
# 请将下面的 1.2.3.4 替换为你服务器真实的公网 IP
external-ip=1.2.3.4

# 认证与安全机制
fingerprint
lt-cred-mech
realm=cstimer.local

# ⚠️ 用户名与密码（与前端 csTimer 界面填入的一致）
# 格式为: user=用户名:密码
user=cstimer:cstimer123

# TURN 中继数据转发 UDP 端口范围（限制端口范围方便在云控制台安全组放行）
min-port=49160
max-port=49200

# 日志输出
verbose
# no-stdout-log
